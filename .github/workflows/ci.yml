name: Checks and platform builds
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  bench:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Build release
        run: cargo build --release --locked
      - name: Benchmark harness regression tests
        run: python3 scripts/test-bench-tui.py
      - name: Performance regression gate (demo mode, no cluster)
        run: python3 scripts/bench-tui.py gate --budgets scripts/bench-budgets.json --binary target/release/kborg --repeat 3 --out bench-results
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: bench-results/
          if-no-files-found: ignore
          retention-days: 14
  build:
    needs: checks
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain and target
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'toolchain installation failed' }
          rustup target add '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'target installation failed' }
      - name: Test natively
        run: |
          cargo test --locked --target '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'native tests failed' }
      - name: Build release
        run: |
          cargo build --release --locked --target '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'release build failed' }
      - name: Package and smoke-test
        run: ./scripts/Package-Release.ps1 -Target '${{ matrix.target }}' -SourceCommit '${{ github.sha }}'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kborg-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 30
      # Debian package from the binary Package-Release.ps1 just smoke-tested.
      # Named deb-* (not kborg-*) so draft releases keep their current assets.
      - name: Build and install-test .deb
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          case "$TARGET" in
            x86_64-unknown-linux-gnu) arch=amd64 ;;
            aarch64-unknown-linux-gnu) arch=arm64 ;;
            *) echo "unexpected Linux target $TARGET" >&2; exit 1 ;;
          esac
          python3 scripts/package-linux.py --binary "dist/staging/kborg-$version-$TARGET/kborg" \
            --version "$version" --arch "$arch" --out dist/deb
          deb=$(ls dist/deb/kborg_*_"$arch".deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          sudo dpkg -i "$deb"
          test "$(/usr/bin/kborg --version)" = "KBorg $version"
          /usr/bin/kborg --demo list pods --json > /dev/null
          test -s /usr/share/bash-completion/completions/kborg
          sudo dpkg -r kborg
          test ! -e /usr/bin/kborg
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb-${{ matrix.target }}
          path: dist/deb/*.deb
          if-no-files-found: error
          retention-days: 30
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: kborg-*
          merge-multiple: true
          path: release-assets
      - name: Validate version and create private draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$RELEASE_TAG" = "v$version"
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "KBorg $version" --notes-file docs/RELEASE_NOTES.md
  # cargo-deny: RustSec advisories, licenses, duplicate crates and sources
  # (policy in deny.toml). Fails on any new advisory affecting Cargo.lock.
  supply-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Install pinned cargo-deny
        run: cargo install --locked --version 0.20.2 cargo-deny
      - name: cargo deny check
        run: cargo deny --locked check
