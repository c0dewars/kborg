name: Checks and platform builds
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt,clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
  build:
    needs: checks
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain and target
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'toolchain installation failed' }
          rustup target add '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'target installation failed' }
      - name: Test natively
        run: |
          cargo test --locked --target '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'native tests failed' }
      - name: Build release
        run: |
          cargo build --release --locked --target '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'release build failed' }
      - name: Package and smoke-test
        run: ./scripts/Package-Release.ps1 -Target '${{ matrix.target }}' -SourceCommit '${{ github.sha }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kborg-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 30
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: kborg-*
          merge-multiple: true
          path: release-assets
      - name: Validate version and create private draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          test "$RELEASE_TAG" = "v$version"
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --title "KBorg $version" --notes-file docs/RELEASE_NOTES.md
