name: Fuzz
# Manual only (repo policy). Each target runs for `seconds` on its own runner,
# starting from the committed seeds; crashes are uploaded as artifacts.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target (3600 = one CPU-hour)
        default: "3600"
        required: true
permissions:
  contents: read
concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        target: [sanitizer, kubeconfig, manifest, archive, k9s_views, k9s_hotkeys, k9s_aliases, k9s_plugins, keymap, ui_config, secret_masked, helm_storage]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +1.99.0 install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz ${{ matrix.target }}
        working-directory: fuzz
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "corpus/$TARGET"
          cargo +nightly fuzz run -O "$TARGET" "corpus/$TARGET" "seeds/$TARGET" -- \
            -dict=yaml.dict -max_total_time="$SECONDS_PER_TARGET" -timeout=10 -rss_limit_mb=3072 -print_final_stats=1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 30
