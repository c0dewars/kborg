# Signed, attested release (manual only; see docs/RELEASE_PROCESS.md).
#
# Dispatch it FROM the release tag so the signing identity and the build
# provenance name the tag:
#   gh workflow run release.yml --ref v0.6.0 -f tag=v0.6.0
#
# It builds the six native archives plus .deb/.rpm, writes SHA256SUMS, signs
# every asset with keyless cosign (Sigstore bundle per file), records GitHub
# build provenance for every asset and creates a DRAFT release. Publishing the
# draft stays a separate maintainer decision.
name: Signed release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (must equal the ref you dispatch from and v<Cargo.toml version>)
        required: true
        type: string
permissions: {}
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag, ref and version agree
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::tag must look like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          if [ "$RUN_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "::error::dispatch this workflow from the tag itself (--ref $RELEASE_TAG); got $RUN_REF"; exit 1
          fi
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::tag $RELEASE_TAG does not match Cargo.toml version $version"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            arch: amd64
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned toolchain and target
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { throw 'toolchain installation failed' }
          rustup target add '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'target installation failed' }
      - name: Test natively
        run: |
          cargo test --locked --target '${{ matrix.target }}'
          if ($LASTEXITCODE -ne 0) { throw 'native tests failed' }

      # macOS Developer ID signing and notarization run only when the owner has
      # added all five repository secrets. Secrets cannot be used in `if:`, so
      # this step reports whether they are all present.
      - name: Detect macOS signing secrets
        id: mac-signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [ -n "$APPLE_DEVELOPER_ID_CERT_P12" ] && [ -n "$APPLE_CERT_PASSWORD" ] && [ -n "$APPLE_ID" ] \
             && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Apple signing secrets not configured; macOS archives are not codesigned or notarized"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import Developer ID certificate into a temporary keychain
        id: keychain
        if: steps.mac-signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/kborg-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          printf '%s' "$APPLE_DEVELOPER_ID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 \
            -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity=$(security find-identity -v -p codesigning "$keychain" \
            | awk '/Developer ID Application/ { print $2; exit }')
          if ! printf '%s' "$identity" | grep -Eq '^[A-F0-9]{40}$'; then
            echo "::error::no Developer ID Application identity in APPLE_DEVELOPER_ID_CERT_P12"; exit 1
          fi
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      - name: Package and smoke-test
        env:
          TARGET: ${{ matrix.target }}
          CODESIGN_IDENTITY: ${{ steps.keychain.outputs.identity }}
        run: |
          $commit = (& git rev-parse --verify HEAD | Out-String).Trim()
          $arguments = @{ Target = $env:TARGET; SourceCommit = $commit }
          if ($env:CODESIGN_IDENTITY) { $arguments.CodesignIdentity = $env:CODESIGN_IDENTITY }
          ./scripts/Package-Release.ps1 @arguments

      # A command-line binary cannot carry a stapled ticket (stapling applies to
      # .app, .pkg and .dmg), so Gatekeeper checks the notarization online. The
      # binary submitted here is byte-identical to the one in the archive.
      - name: Notarize macOS binary
        if: steps.mac-signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          binary="dist/staging/kborg-$VERSION-$TARGET/kborg"
          codesign --verify --strict --verbose=2 "$binary"
          submission="$RUNNER_TEMP/kborg-notarize.zip"
          ditto -c -k --keepParent "$binary" "$submission"
          xcrun notarytool submit "$submission" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json"
          status=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/notary.json")
          if [ "$status" != "Accepted" ]; then
            echo "::error::notarization status: $status"; cat "$RUNNER_TEMP/notary.json"; exit 1
          fi
          archive="dist/packages/kborg-$VERSION-$TARGET.tar.gz"
          mkdir -p "$RUNNER_TEMP/check" && tar -xzf "$archive" -C "$RUNNER_TEMP/check"
          cmp "$binary" "$RUNNER_TEMP/check/kborg-$VERSION-$TARGET/kborg"
      - name: Remove temporary keychain
        if: always() && steps.mac-signing.outputs.enabled == 'true'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/kborg-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/developer-id.p12"

      - name: Build and install-test .deb and .rpm
        if: runner.os == 'Linux'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/package-linux.py --binary "dist/staging/kborg-$VERSION-$TARGET/kborg" \
            --version "$VERSION" --arch "$ARCH" --out dist/deb
          deb=$(ls dist/deb/kborg_*_"$ARCH".deb)
          dpkg-deb --info "$deb"
          sudo dpkg -i "$deb"
          test "$(/usr/bin/kborg --version)" = "KBorg $VERSION"
          /usr/bin/kborg --demo list pods --json > /dev/null
          sudo dpkg -r kborg
          test ! -e /usr/bin/kborg

          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends rpm
          top="$RUNNER_TEMP/rpmbuild"
          mkdir -p "$top/SOURCES" dist/rpm
          cp "dist/packages/kborg-$VERSION-$TARGET.tar.gz" "$top/SOURCES/"
          rpmbuild -bb --define "_topdir $top" --define "upstream_version $VERSION" packaging/rpm/kborg.spec
          cp "$top"/RPMS/*/kborg-*.rpm dist/rpm/
          rpm -qip dist/rpm/*.rpm
          rpm -qlp dist/rpm/*.rpm | grep -qx /usr/bin/kborg
          mkdir -p dist/linux-packages
          cp dist/deb/*.deb dist/rpm/*.rpm dist/linux-packages/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/packages/*
          if-no-files-found: error
          retention-days: 7
      - if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-packages-${{ matrix.target }}
          path: dist/linux-packages/*
          if-no-files-found: error
          retention-days: 7

  # Signs and attests. The only job holding an OIDC token; it cannot write to
  # the repository or the release.
  sign:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Check per-archive checksums and write SHA256SUMS
        working-directory: release-assets
        run: |
          set -euo pipefail
          # GitHub rewrites "~" in asset names; rename first (Debian/RPM
          # pre-release versions such as 0.6.0~rc.1) so signed names match.
          for f in *~*; do
            if [ -e "$f" ]; then mv -- "$f" "${f//\~/.}"; fi
          done
          for f in *.sha256; do sha256sum --check --strict "$f"; done
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort \
            | xargs sha256sum > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign every asset with keyless cosign
        working-directory: release-assets
        env:
          IDENTITY: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
        run: |
          set -euo pipefail
          for f in $(find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort); do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f" > /dev/null
          done
          # Self-check with the exact command users run.
          for f in $(find . -maxdepth 1 -type f ! -name '*.sigstore.json' -printf '%f\n'); do
            cosign verify-blob --bundle "$f.sigstore.json" --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$f"
          done
      - name: Record build provenance for every asset
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

  draft-release:
    needs: [prepare, sign]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-release
          path: release-assets
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft "${prerelease[@]}" \
            --title "KBorg $VERSION" --notes-file docs/RELEASE_NOTES.md
