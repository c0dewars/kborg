[package]
name = "k8borg"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Kubernetes operations, under your control"
license = "Apache-2.0"
publish = false

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring"] }
k8s-openapi = { version = "0.28", features = ["v1_34"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time", "net", "sync"] }
http = "1"
http-body-util = "0.1"
tower = { version = "0.5", default-features = false, features = ["util"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
bytes = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

