[package]
name = "kborg"
version = "0.5.0-rc.3"
edition = "2024"
rust-version = "1.89"
description = "Kubernetes operations, under your control"
license = "Apache-2.0"
publish = false

[dependencies]
crossterm = { version = "0.29", default-features = false, features = ["events", "windows", "bracketed-paste"] }
kube = { version = "4.2", default-features = false, features = ["client", "rustls-tls", "ring", "ws", "http-proxy", "socks5"] }
k8s-openapi = { version = "0.28", features = ["v1_34"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Already used by kube; local manifest previews need bounded YAML decoding.
serde-saphyr = { version = "2.0.0", default-features = false, features = ["deserialize"] }
regex = "1"
# Helm release storage uses gzip; maintained bounded decoder, no native zlib.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "io-util", "signal"] }
http = "1"
# ExecCredential policy fingerprints and credential encoding (already transitive).
ring = "0.17"
base64 = "0.23"
http-body-util = "0.1"
# Deadline adapter for object bodies; the crate is already transitive.
http-body = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "io"] }
# Terminal cell widths for Unicode display (already transitive via serde-saphyr).
unicode-width = { version = "0.2", default-features = false }
# Buf access for gzip response decoding (already transitive via http/hyper).
bytes = "1"

[target.'cfg(unix)'.dependencies]
# Already used by crossterm. Full-TTY sessions poll and read raw stdin bytes
# with a timeout, so no keystroke is consumed after the session ends.
rustix = { version = "1", default-features = false, features = ["std", "event"] }

[dev-dependencies]
# Virtual time keeps timeout tests independent of host filesystem/CI speed.
# This enables a test-only feature on the existing Tokio dependency.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
strip = true

# Self-spawn supervision fixtures must fit the same 128 MiB executable limit
# as registered tools. Generated Kubernetes types and fixture code exceed it
# on GNU when DWARF is enabled; production release settings are unchanged.
[profile.test]
debug = 0

[lints.rust]
unsafe_code = "forbid"
# cargo-fuzz builds with --cfg fuzzing; src/fuzzing.rs is compiled only then and in tests.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

