# cargo-fuzz targets; see "Fuzzing" in docs/DEVELOPMENT_GUIDE.md.
# A separate workspace, so fuzz-only dependencies never reach the kborg crate.
[package]
name = "kborg-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kborg = { path = ".." }

[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "sanitizer"
path = "fuzz_targets/sanitizer.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kubeconfig"
path = "fuzz_targets/kubeconfig.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
